plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

def appVersion = '3.0'
def readProps = { String path ->
    def p = new Properties()
    def f = file(path)
    if (f.exists()) f.withInputStream { p.load(it) }
    p
}
// Gemini key: GitHub secret / env first, then app_ai/gemini.properties
def geminiKey = (System.getenv('GEMINI_API_KEY') ?: readProps('gemini.properties').getProperty('GEMINI_API_KEY') ?: '').trim()
// Signing: custom keystore from env, else the bundled app_ai/keystore
def ks = readProps('keystore/keystore.properties')
def envKs = System.getenv('KEYSTORE_FILE')
def hasSigning = envKs || ks.getProperty('storeFile')

android {
    namespace 'com.dai.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.dai.app'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName appVersion
        buildConfigField 'String', 'GEMINI_API_KEY', "\"${geminiKey}\""
    }
    signingConfigs {
        release {
            if (envKs) {
                storeFile file(envKs)
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
            } else if (hasSigning) {
                storeFile file("keystore/${ks.getProperty('storeFile')}")
                storePassword ks.getProperty('storePassword')
                keyAlias ks.getProperty('keyAlias')
                keyPassword ks.getProperty('keyPassword')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (hasSigning) signingConfig signingConfigs.release
        }
        debug {
            if (hasSigning) signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    buildFeatures {
        compose true
        buildConfig true
    }
    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2024.10.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-core'
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
}
