name: Android

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - name: Find Android project
        id: find
        run: |
          SETTINGS=$(find . -maxdepth 3 \( -name settings.gradle -o -name settings.gradle.kts \) -not -path "./.git/*" | head -n 1)
          if [ -z "$SETTINGS" ]; then
            echo "::error::settings.gradle not found. Upload the whole project (settings.gradle, build.gradle, app_ai/)."
            exit 1
          fi
          echo "dir=$(dirname "$SETTINGS")" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: Install SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;34.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Use custom keystore (only if secret is set)
        if: env.KEYSTORE_B64 != ''
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Build release and debug APK
        working-directory: ${{ steps.find.outputs.dir }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle :app_ai:assembleRelease :app_ai:assembleDebug --stacktrace --no-daemon
      - name: Collect APKs
        run: |
          mkdir -p dist
          cp "${{ steps.find.outputs.dir }}"/app_ai/build/outputs/apk/release/*.apk dist/dai-release.apk
          cp "${{ steps.find.outputs.dir }}"/app_ai/build/outputs/apk/debug/*.apk dist/dai-debug.apk
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: dai-apk
          path: dist/*.apk
          if-no-files-found: error
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
